%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.77.0.0/16]"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "80"
    SSH_PORTS: "22"
default-log-dir: /logs/suricata
stats:
  enabled: yes
  interval: 5
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - drop
        - http
        - flow
        - stats:
            totals: yes
            threads: no
  - fast:
      enabled: yes
      filename: fast.log
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        filename: /logs/suricata/suricata.log
max-pending-packets: 1024
runmode: workers
stream:
  memcap: 32mb
  checksum-validation: no
  inline: yes
  reassembly:
    memcap: 32mb
flow:
  memcap: 32mb
  hash-size: 4096
  prealloc: 1000
default-rule-path: /opt/lab/suricata/rules
rule-files:
  - lab.rules
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
nfq:
  mode: accept
  fail-open: no
  batchcount: 1
app-layer:
  protocols:
    http:
      enabled: yes
    ssh:
      enabled: yes
unix-command:
  enabled: yes
  filename: /run/suricata-command.socket
