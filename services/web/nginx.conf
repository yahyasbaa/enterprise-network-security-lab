user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /logs/web/error.log info;
events { worker_connections 128; }
http {
    server_tokens off;
    log_format structured escape=json '{"timestamp":"$time_iso8601","src_ip":"$remote_addr","dest_ip":"$server_addr","proto":"HTTP","method":"$request_method","uri":"$request_uri","request":"$request","status":$status,"bytes":$body_bytes_sent}';
    access_log /logs/web/access.jsonl structured;
    server {
        listen 80;
        root /opt/lab/services/web/public;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'" always;
        location / { try_files $uri $uri/ =404; }
        location /private {
            auth_basic "Enterprise Lab";
            auth_basic_user_file /run/secrets/web_htpasswd;
            alias /opt/lab/services/web/public/index.html;
        }
    }
}
